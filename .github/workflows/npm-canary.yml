name: Public npm publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Publish a canary or the reviewed stable package versions
        required: true
        default: canary
        type: choice
        options:
          - canary
          - stable
      stable_package:
        description: Stable package to publish; ignored for canary releases
        required: true
        default: all
        type: choice
        options:
          - all
          - design-tokens
          - console-ui

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-public-release
  cancel-in-progress: false

jobs:
  publish:
    # Enable only after the public bootstrap and publisher setup in docs/release-process.md.
    if: github.repository == 'Gruznov/console-ui' && github.ref == 'refs/heads/main' && vars.NPM_PUBLIC_PUBLISH_ENABLED == 'true'
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Pin OIDC-capable npm
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Provide Changesets base branch
        run: |
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi

      - name: Check workspace
        run: npm run check

      - name: Require packages to be public before publishing
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          for (const name of ["@gruznov/design-tokens", "@gruznov/console-ui"]) {
            // No Authorization header: private packages must fail this read.
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}`);
            assert.equal(response.ok, true, `${name} must already be publicly readable; complete the reviewed @gruznov bootstrap in docs/release-process.md`);
            const metadata = await response.json();
            assert.equal(metadata.name, name);
            assert.ok(Object.keys(metadata.versions ?? {}).length > 0, `${name} has no public versions`);
          }
          NODE

      - name: Resolve reviewed package versions
        run: |
          tokens_version="$(node --print "require('./packages/design-tokens/package.json').version")"
          components_version="$(node --print "require('./packages/console-ui/package.json').version")"

          echo "STABLE_TOKENS_VERSION=$tokens_version" >> "$GITHUB_ENV"
          echo "STABLE_COMPONENTS_VERSION=$components_version" >> "$GITHUB_ENV"

      - name: Prepare canary artifacts
        if: inputs.channel == 'canary'
        run: >-
          npm run canary:prepare --
          --version "${STABLE_COMPONENTS_VERSION}-canary.${{ github.run_number }}.${{ github.run_attempt }}"
          --output "$RUNNER_TEMP/console-ui-canary"

      - name: Publish canary design tokens through OIDC
        if: inputs.channel == 'canary'
        run: >-
          npm publish "$RUNNER_TEMP/console-ui-canary/design-tokens.tgz"
          --tag canary
          --access public

      - name: Publish canary components through OIDC
        if: inputs.channel == 'canary'
        run: >-
          npm publish "$RUNNER_TEMP/console-ui-canary/console-ui.tgz"
          --tag canary
          --access public

      - name: Publish stable design tokens through OIDC
        if: inputs.channel == 'stable' && (inputs.stable_package == 'all' || inputs.stable_package == 'design-tokens')
        run: npm publish ./packages/design-tokens --access public

      - name: Publish stable components through OIDC
        if: inputs.channel == 'stable' && (inputs.stable_package == 'all' || inputs.stable_package == 'console-ui')
        run: npm publish ./packages/console-ui --access public

      - name: Record published version
        run: |
          if [[ "${{ inputs.channel }}" == "canary" ]]; then
            version="${STABLE_COMPONENTS_VERSION}-canary.${{ github.run_number }}.${{ github.run_attempt }}"
            packages="design-tokens and console-ui"
          else
            version="design-tokens ${STABLE_TOKENS_VERSION}; console-ui ${STABLE_COMPONENTS_VERSION}"
            packages="${{ inputs.stable_package }}"
          fi

          echo "### Public npm ${{ inputs.channel }}" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Packages: \`$packages\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Versions: \`$version\`" >> "$GITHUB_STEP_SUMMARY"
