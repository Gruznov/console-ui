name: StyleX authoring spike

on:
  pull_request:
    paths:
      - "spikes/stylex-authoring/**"
      - "docs/spikes/2026-08-12-stylex-authoring.md"
      - ".github/workflows/stylex-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/stylex-authoring

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install spike dependencies
        run: npm install --no-audit --no-fund

      - name: Verify StyleX spike
        run: npm run verify
